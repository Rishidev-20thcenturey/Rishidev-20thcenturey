<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="324" height="66" viewBox="0 0 324 66" role="img" aria-label="TECH STACK">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#0c1322" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="hacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-120 0;120 0;-120 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="322" height="64" rx="15" fill="url(#hbg)" stroke="#2dd4bf" stroke-opacity=".26"/>
  <rect x="14" y="18" width="6" height="30" rx="3" fill="url(#hacc)"/>
  <text x="34" y="43" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2.6" fill="#eef4ff">TECH STACK</text>
  <circle cx="298" cy="33" r="4" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>
