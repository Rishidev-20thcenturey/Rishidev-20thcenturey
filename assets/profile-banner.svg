    <text x="74" y="224" font-size="23" font-weight="600" fill="#dce8fb">AI Research  ·  Generative Models  ·  Software Engineering</text>
    <text x="75" y="270" font-size="13" font-weight="600" letter-spacing="2.0" fill="#8ca6c7">BUILD CAREFULLY  /  MEASURE HONESTLY  /  KEEP SHIPPING</text>
